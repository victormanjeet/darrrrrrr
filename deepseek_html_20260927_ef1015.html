<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>System Security</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    font-family: 'Courier New', monospace;
    color: #ff2b2b;
    user-select: none;
    cursor: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 20px; text-align: center;
    z-index: 2;
  }

  /* ===== FOG / STATIC OVERLAY ===== */
  #fog {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(80,0,0,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(80,0,0,0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(30,0,0,0.3) 0%, transparent 70%);
    animation: fogMove 8s infinite alternate;
  }
  @keyframes fogMove {
    0% { transform: translate(0,0) scale(1); }
    100% { transform: translate(10px,-10px) scale(1.05); }
  }

  #static {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
    animation: staticShift 0.15s infinite;
  }
  @keyframes staticShift {
    0% { transform: translate(0,0); }
    50% { transform: translate(-3px,2px); }
    100% { transform: translate(2px,-3px); }
  }

  /* ===== BLOOD DRIPS ===== */
  .blood-drip {
    position: fixed; top: 0; width: 3px;
    background: linear-gradient(180deg, #8b0000, #ff0000, #4d0000);
    z-index: 3; pointer-events: none;
    box-shadow: 0 0 8px #ff0000;
    border-radius: 0 0 3px 3px;
  }

  /* ===== WHISPER TEXT ===== */
  .whisper {
    position: fixed;
    color: rgba(255, 0, 0, 0.35);
    font-size: 14px;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
    pointer-events: none;
    z-index: 4;
    animation: whisperFade 4s forwards;
    text-shadow: 0 0 10px #ff0000;
  }
  @keyframes whisperFade {
    0% { opacity: 0; transform: scale(0.9); }
    30% { opacity: 0.9; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.05); }
  }

  /* ===== START SCREEN ===== */
  .start-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%;
  }
  .start-title {
    font-size: clamp(22px, 7vw, 38px);
    font-weight: bold; letter-spacing: 3px;
    color: #ff2b2b;
    text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 40px #ff0000;
    animation: flicker 0.15s infinite alternate;
    margin-bottom: 15px;
  }
  .start-sub {
    font-size: 13px; color: #aa4444;
    letter-spacing: 3px; margin-bottom: 35px;
    animation: flicker 0.3s infinite alternate;
  }
  .start-btn {
    padding: 20px 55px;
    font-size: 20px; font-family: inherit; font-weight: bold;
    letter-spacing: 4px; color: #fff;
    background: #8b0000;
    border: 2px solid #ff0000;
    border-radius: 4px; cursor: pointer;
    box-shadow: 0 0 30px #ff0000, 0 0 60px #8b000088;
    animation: pulse 0.8s infinite alternate;
    text-shadow: 0 0 10px #fff;
  }
  .start-btn:active { transform: scale(0.94); }
  .warn-small {
    margin-top: 25px; font-size: 11px;
    color: #663333; letter-spacing: 2px;
  }
  .warn-small .blink { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== COMMON ===== */
  .alert-title {
    font-size: clamp(18px, 5.5vw, 32px);
    font-weight: bold; letter-spacing: 2px;
    color: #ff2b2b;
    text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
    animation: flicker 0.15s infinite alternate;
    margin-bottom: 25px;
  }
  @keyframes flicker { 0%{opacity:1} 100%{opacity:0.7} }
  @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.06)} }
  @keyframes fadeIn { to{opacity:1} }

  /* ===== STAGE 1 ===== */
  .progress-wrap {
    width: 90%; max-width: 400px; height: 28px;
    border: 2px solid #8b0000; border-radius: 2px;
    background: #0a0000; overflow: hidden;
    box-shadow: 0 0 20px #ff0000 inset;
    margin-bottom: 12px;
    position: relative;
  }
  .progress-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,0,0,0.4), transparent);
    animation: scanLine 1.5s infinite linear;
  }
  @keyframes scanLine { 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4d0000, #ff0000, #ff5555, #ff0000);
    background-size: 200% 100%;
    box-shadow: 0 0 25px #ff0000;
    transition: width 0.2s linear;
    animation: barShine 1s infinite linear;
  }
  @keyframes barShine { 0%{background-position:0% 0} 100%{background-position:200% 0} }
  .percent {
    font-size: 24px; color: #ff5555;
    margin-bottom: 20px; text-shadow: 0 0 10px #ff0000;
    font-weight: bold; letter-spacing: 2px;
  }
  .scan-log {
    width: 90%; max-width: 400px; height: 180px;
    overflow: hidden; text-align: left;
    font-size: 13px; line-height: 1.7;
    color: #ff4d4d; background: #0a0000;
    border: 1px solid #4d0000; border-radius: 4px;
    padding: 10px 14px;
    box-shadow: 0 0 15px #330000 inset;
  }
  .scan-log div { opacity: 0; animation: fadeIn 0.2s forwards; }
  .scan-log .danger { color: #ff0000; font-weight: bold; text-shadow: 0 0 8px #ff0000; }
  .scan-log .creepy { color: #ff00ff; font-style: italic; }

  /* ===== STAGE 2 ===== */
  #stage2 {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%;
  }
  .access-alert {
    font-size: clamp(18px, 5vw, 28px);
    color: #ff2b2b; text-shadow: 0 0 15px red;
    margin-bottom: 20px; letter-spacing: 2px;
    animation: flicker 0.1s infinite alternate;
  }
  .countdown {
    font-size: clamp(80px, 30vw, 180px);
    font-weight: bold; color: #ff0000;
    text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000;
    animation: pulse 0.6s infinite alternate;
    font-family: 'Courier New', monospace;
  }
  .terminal {
    width: 90%; max-width: 400px; height: 140px;
    margin-top: 22px; background: #0a0000;
    border: 1px solid #4d0000; border-radius: 4px;
    padding: 10px 14px; font-size: 12px;
    text-align: left; color: #00ff44;
    overflow: hidden;
    box-shadow: 0 0 15px #330000 inset;
    text-shadow: 0 0 6px #00ff44;
  }
  .terminal div { opacity: 0; animation: fadeIn 0.2s forwards; }
  .terminal .warn { color: #ff2b2b; text-shadow: 0 0 6px #ff0000; }

  /* ===== RED SIREN ===== */
  #siren {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 5;
    background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.5) 100%);
    opacity: 0; transition: opacity 0.3s;
  }
  #siren.on { animation: sirenPulse 0.6s infinite; }
  @keyframes sirenPulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.7; }
  }

  /* ===== EFFECTS ===== */
  .glitch { animation: glitchAnim 0.1s infinite; }
  @keyframes glitchAnim {
    0%{transform:translate(0)}
    20%{transform:translate(-3px,2px)}
    40%{transform:translate(3px,-2px)}
    60%{transform:translate(-2px,-3px)}
    80%{transform:translate(2px,3px)}
    100%{transform:translate(-1px,1px)}
  }
  .shake { animation: shakeAnim 0.06s infinite; }
  @keyframes shakeAnim {
    0%{transform:translate(0,0)}
    25%{transform:translate(-5px,4px)}
    50%{transform:translate(5px,-4px)}
    75%{transform:translate(-4px,-5px)}
    100%{transform:translate(4px,5px)}
  }

  /* ===== TEXT SCRAMBLE ===== */
  .scramble { color: #ff0000; text-shadow: 0 0 10px #ff0000; }

  /* ===== JUMPSCARE ===== */
  #jumpscare {
    display: none; position: fixed; inset: 0;
    background: #000; z-index: 999;
    justify-content: center; align-items: center;
  }
  #jumpscare svg {
    width: 100vmin; height: 100vmin;
    filter: drop-shadow(0 0 50px #ff0000) contrast(1.5);
    animation: scareZoom 0.3s ease-out;
  }
  @keyframes scareZoom {
    from { transform: scale(0.1) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .flash {
    position: fixed; inset: 0; background: #ff0000;
    opacity: 0; z-index: 1000; pointer-events: none;
  }
  .flash.on { animation: flashAnim 0.3s; }
  @keyframes flashAnim { 0%{opacity:1} 100%{opacity:0} }
  .flash.white { background: #ffffff; }

  /* ===== REVEAL ===== */
  #reveal {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%; padding: 20px;
  }
  #reveal h1 {
    font-size: clamp(34px, 11vw, 70px);
    color: #ffcc00;
    text-shadow: 0 0 25px #ff9900, 0 0 50px #ff6600;
    margin-bottom: 15px;
    animation: pop 0.5s ease-out;
  }
  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  #reveal .hacked-box {
    width: 90%; max-width: 400px;
    background: #1a0000; border: 1px solid #4d0000;
    border-radius: 6px; padding: 15px;
    margin: 15px 0; text-align: left;
    font-size: 13px; color: #ff6666;
    box-shadow: 0 0 20px #330000 inset;
  }
  #reveal .hacked-box .row {
    display: flex; justify-content: space-between;
    padding: 6px 0; border-bottom: 1px dashed #330000;
  }
  #reveal .hacked-box .row:last-child { border: none; }
  #reveal .hacked-box .val { color: #00ff44; font-weight: bold; text-shadow: 0 0 6px #00ff44; }
  #reveal p {
    font-size: clamp(15px, 4vw, 20px);
    color: #ffffff; margin-bottom: 25px;
    line-height: 1.5;
  }
  .btn-row {
    display: flex; gap: 12px; flex-wrap: wrap;
    justify-content: center;
  }
  .play-btn, .share-btn {
    padding: 16px 34px;
    font-size: 16px; font-family: inherit; font-weight: bold;
    letter-spacing: 2px; border: none; border-radius: 40px;
    cursor: pointer; transition: transform 0.15s;
  }
  .play-btn {
    color: #000;
    background: linear-gradient(90deg, #ffcc00, #ff8800);
    box-shadow: 0 0 25px #ffaa00;
  }
  .share-btn {
    color: #fff; background: #25D366;
    box-shadow: 0 0 25px #25D36688;
  }
  .play-btn:active, .share-btn:active { transform: scale(0.94); }
</style>
</head>

/* ---------- AUDIO ENGINE ---------- */
let audioCtx = null;
let heartbeatTimer = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, vol, type='square') {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.value = vol;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function playScare() {
  if (!audioCtx) return;
  // high-pitch scream
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(1600, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 1.2);
  g.gain.setValueAtTime(0.7, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 1.4);

  // noise burst
  const bufferSize = audioCtx.sampleRate * 1.5;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.4, audioCtx.currentTime);
  ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
  noise.connect(ng); ng.connect(audioCtx.destination);
  noise.start();

  // low rumble
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type = 'sine'; o2.frequency.value = 40;
  g2.gain.setValueAtTime(0.6, audioCtx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.6);
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.start(); o2.stop(audioCtx.currentTime + 1.6);
}
function heartbeat() {
  if (!audioCtx) return;
  beep(55, 0.1, 0.3, 'sine');
  setTimeout(() => beep(45, 0.14, 0.25, 'sine'), 140);
}

  o.type = 'triangle';
  o.frequency.setValueAtTime(200, audioCtx.currentTime);

  g.gain.setValueAtTime(0.08, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.8);
}

    <line x1="115" y1="148" x2="115" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="130" y1="148" x2="130" y2="180" stroke="#000" stroke-width="2"/>
  </svg>`,

  // Face 3 : Ghost girl
  `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="fg3" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#ddd"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
    </defs>
    <!-- hair -->
    <path d="M20 100 Q20 20 100 20 Q180 20 180 100 L180 180 L160 160 L140 180 L120 160 L100 180 L80 160 L60 180 L40 160 L20 180 Z" fill="#000"/>
    <!-- face -->
    <ellipse cx="100" cy="105" rx="55" ry="70" fill="url(#fg3)"/>
    <!-- dark eyes -->
    <ellipse cx="78" cy="95" rx="14" ry="18" fill="#000"/>
    <ellipse cx="122" cy="95" rx="14" ry="18" fill="#000"/>
    <circle cx="78" cy="95" r="4" fill="#ff0000"/>
    <circle cx="122" cy="95" r="4" fill="#ff0000"/>
    <!-- mouth -->
    <path d="M85 145 Q100 165 115 145 Q100 155 85 145 Z" fill="#000"/>
    <!-- blood -->
    <path d="M95 155 Q94 170 96 185 L104 185 Q106 170 105 155 Z" fill="#8b0000"/>
  </svg>`
];

/* ---------- STATE ---------- */
let currentCountdownInterval = null;
let currentScanInterval = null;

/* ---------- BLOOD DRIPS ---------- */
function startBloodDrips() {
  setInterval(() => {
    if (Math.random() > 0.7) {
      const drip = document.createElement('div');
      drip.className = 'blood-drip';
      drip.style.left = Math.random() * 100 + 'vw';
      drip.style.height = (Math.random() * 40 + 20) + 'vh';
      drip.style.animation = `dripFall ${Math.random()*2+2}s linear forwards`;
      document.body.appendChild(drip);
      setTimeout(() => drip.remove(), 4000);
    }
  }, 800);
}

/* ---------- WHISPER TEXT ---------- */
const whispers = [
  "peeche mat dekho...",
  "tumhe dekh raha hoon",
  "darwaza band karo",
  "akela ho?",
  "bachao...",
  "andar aa jao",
  "tumhara naam pata hai",
  "mat bhaago",
];
function startWhispers() {
  setInterval(() => {
    if (Math.random() > 0.6) {
      const w = document.createElement('div');
      w.className = 'whisper';
      w.textContent = whispers[Math.floor(Math.random() * whispers.length)];
      w.style.left = Math.random() * 70 + 15 + 'vw';
      w.style.top = Math.random() * 70 + 15 + 'vh';
      document.body.appendChild(w);
      whisperSound();
      setTimeout(() => w.remove(), 4200);
    }
  }, 3500);
}

/* ---------- STAGE 1 ---------- */
function runStage1() {
  startScreen.style.display = 'none';
  stage1.style.display = 'flex';
  startBloodDrips();
  startWhispers();

  let progress = 0;
  let msgIndex = 0;

  currentScanInterval = setInterval(() => {
    progress += Math.random() * 4 + 1.5;
    if (progress > 100) progress = 100;

    progressBar.style.width = progress + '%';
    percent.textContent = Math.floor(progress) + '%';

    if (Math.random() > 0.3 && msgIndex < scanItems.length) {
      const item = scanItems[msgIndex];
      const line = document.createElement('div');
      line.textContent = '▸ ' + item.t;
      if (item.c) line.classList.add(item.c);
      scanLog.appendChild(line);
      scanLog.scrollTop = scanLog.scrollHeight;
      msgIndex++;

      if (item.c === 'danger') {
        beep(150, 0.2, 0.2, 'sawtooth');
        vibrate(100);
      } else if (item.c === 'creepy') {
        whisperSound();
        vibrate(40);
      } else {
        beep(600 + Math.random()*400, 0.04, 0.05);
      }
    }

    if (progress > 70) {
      document.getElementById('app').classList.add('shake');
    }

    if (progress >= 100) {
      clearInterval(currentScanInterval);
      setTimeout(runStage2, 1000);
    }
  }, 180);
}

/* ---------- STAGE 2 ---------- */
function runStage2() {
  stage1.style.display = 'none';
  stage2.style.display = 'flex';
  document.getElementById('app').classList.add('shake');
  vibrate([100, 50, 100]);

  let count = 10;
  countdownEl.textContent = count;
  let tIndex = 0;

  const termInt = setInterval(() => {
    if (tIndex < terminalItems.length) {
      const item = terminalItems[tIndex];
      const line = document.createElement('div');
      line.textContent = item.t;
      if (item.w) line.classList.add('warn');
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      tIndex++;
      beep(1200, 0.03, 0.04, 'square');
    }
  }, 350);

  currentCountdownInterval = setInterval(() => {
    count--;
    countdownEl.textContent = count;

    if (count <= 5) {
      heartbeat();
      vibrate([100, 30, 100]);
      siren.classList.add('on');
    } else {
      beep(900, 0.08, 0.08);
      vibrate(50);
    }

    if (count <= 3) {
      document.body.classList.add('glitch');
      // scramble alert text
      scrambleText($('accessAlert'), '⚠ ACCESS DENIED ⚠');
    }
    if (count <= 0) {
      clearInterval(currentCountdownInterval);
      clearInterval(termInt);
      triggerJumpscare();
    }
  }, 1000);
}

/* ---------- TEXT SCRAMBLE ---------- */
function scrambleText(el, finalText) {
  const chars = "!@#$%^&*()_+-=[]{}|;:,.<>?ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let iterations = 0;
  const interval = setInterval(() => {
    el.textContent = finalText.split('').map((c, i) => {
      if (i < iterations) return finalText[i];
      return chars[Math.floor(Math.random() * chars.length)];
    }).join('');
    iterations += 0.5;
    if (iterations >= finalText.length) clearInterval(interval);
  }, 40);
}

/* ---------- STAGE 3 : JUMPSCARE ---------- */
function triggerJumpscare() {
  document.getElementById('app').classList.remove('shake');
  document.body.classList.remove('glitch');
  siren.classList.remove('on');

  const face = scareFaces[Math.floor(Math.random() * scareFaces.length)];
  jumpscare.innerHTML = face;

  // Multi-layer flash
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 300);
  setTimeout(() => {
    flashWhite.classList.add('on');
    setTimeout(() => flashWhite.classList.remove('on'), 300);
  }, 300);
  setTimeout(() => {
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 300);
  }, 600);

  jumpscare.style.display = 'flex';
  playScare();
  vibrate([400, 100, 400, 100, 600, 100, 800]);

  document.body.classList.add('glitch');

  setTimeout(() => {
    jumpscare.style.display = 'none';
    document.body.classList.remove('glitch');
    showReveal();
  }, 1500);
}

/* ---------- REVEAL ---------- */
function showReveal() {
  stage2.style.display = 'none';
  reveal.style.display = 'flex';
  vibrate([50, 50, 50]);
  beep(800, 0.1, 0.1, 'sine');
  setTimeout(() => beep(1000, 0.1, 0.1, 'sine'), 120);
  setTimeout(() => beep(1200, 0.15, 0.1, 'sine'), 240);
}

/* ---------- PLAY AGAIN ---------- */
$('playAgain').addEventListener('click', () => {
  reveal.style.display = 'none';
  progressBar.style.width = '0%';
  percent.textContent = '0%';
  scanLog.innerHTML = '';
  terminal.innerHTML = '';
  countdownEl.textContent = '10';
  $('accessAlert').textContent = '⚠ UNAUTHORIZED ACCESS ⚠';
  document.getElementById('app').classList.remove('shake');
  document.body.classList.remove('glitch');
  jumpscare.innerHTML = '';
  startScreen.style.display = 'flex';
  siren.classList.remove('on');
});

/* ---------- SHARE ---------- */
$('shareBtn').addEventListener('click', async () => {
  const shareData = {
    title: '😱 Ye website dekh ke dar jao!',
    text: 'Mere dost ne ye bheja tha — tu bhi try kar! Bohot darawana hai 😨',
    url: window.location.href,
  };
  try {
    if (navigator.share) await navigator.share(shareData);
    else {
      await navigator.clipboard.writeText(window.location.href);
      alert('Link copy ho gaya! Ab dost ko bhej do 😈');
    }
  } catch (e) {
    try {
      await navigator.clipboard.writeText(window.location.href);
      alert('Link copy ho gaya! Ab dost ko bhej do 😈');
    } catch (err) {
      alert('Link: ' + window.location.href);
    }
  }
});

/* ---------- START ---------- */
startBtn.addEventListener('click', () => {
  initAudio();
  beep(400, 0.1, 0.1);
  setTimeout(() => beep(600, 0.1, 0.1), 100);
  setTimeout(() => beep(900, 0.15, 0.12), 200);
  setTimeout(() => playScare(), 350);
  runStage1();
});

/* ---------- PREVENT ZOOM ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
</script>
